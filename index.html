<script>
// ===================== الإعدادات =====================
const FETCH_TIMEOUT_MS = 6000;
const OZ_TO_GRAM = 31.1034768;

// ===================== مصادر الذهب (3 بدائل) =====================
const GOLD_SOURCES = [
  {
    name: 'alqanaas.com',
    url: 'https://alqanaas.com/gold-data.json',
    parse: (d) => {
      const live = d && d.liveXauusd;
      const p = live ? Number(live.mid || live.ask || 0) : 0;
      return (p > 0) ? p : null;
    }
  },
  {
    name: 'xaus.com',
    url: 'https://xaus.com/api/v1/spot?compact=1',
    parse: (d) => {
      const p = d ? Number((d.xau && d.xau.price) || d.spot_usd_oz || 0) : 0;
      return (p > 0) ? p : null;
    }
  },
  {
    name: 'gold-api.com',
    url: 'https://api.gold-api.com/price/XAU',
    parse: (d) => {
      const p = d ? Number(d.price || 0) : 0;
      return (p > 0) ? p : null;
    }
  }
];

// ===================== مصادر العملات (بديلان) =====================
const CURRENCY_SOURCES = [
  {
    name: 'fawazahmed0/jsDelivr',
    url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
    parse: (d) => {
      if (!d || !d.usd || typeof d.usd !== 'object') return null;
      const out = {};
      for (const k in d.usd) out[k.toUpperCase()] = d.usd[k];
      return Object.keys(out).length ? out : null;
    }
  },
  {
    name: 'open.er-api.com',
    url: 'https://open.er-api.com/v6/latest/USD',
    parse: (d) => (d && d.rates && Object.keys(d.rates).length) ? d.rates : null
  }
];

// ===================== الدول والعملات (9 دول — بدون السودان) =====================
const COUNTRIES = [
  { code: 'EG', name: 'مصر', flag: '🇪🇬', currency: 'EGP' },
  { code: 'SA', name: 'السعودية', flag: '🇸🇦', currency: 'SAR' },
  { code: 'AE', name: 'الإمارات', flag: '🇦🇪', currency: 'AED' },
  { code: 'BH', name: 'البحرين', flag: '🇧🇭', currency: 'BHD' },
  { code: 'IQ', name: 'العراق', flag: '🇮🇶', currency: 'IQD' },
  { code: 'KW', name: 'الكويت', flag: '🇰🇼', currency: 'KWD' },
  { code: 'QA', name: 'قطر', flag: '🇶🇦', currency: 'QAR' },
  { code: 'OM', name: 'عُمان', flag: '🇴🇲', currency: 'OMR' },
  { code: 'JO', name: 'الأردن', flag: '🇯🇴', currency: 'JOD' }
];

const TARGET_CURRENCIES = ['USD', 'EUR', 'GBP', 'SAR', 'AED'];
const CURRENCY_NAMES = {
  USD: 'الدولار الأمريكي', EUR: 'اليورو', GBP: 'الجنيه الإسترليني',
  SAR: 'الريال السعودي', AED: 'الدرهم الإماراتي'
};
const CURRENCY_SYMBOLS = {
  EGP: 'ج.م', SAR: 'ر.س', AED: 'د.إ', BHD: 'د.ب',
  IQD: 'ع.د', KWD: 'د.ك', QAR: 'ر.ق', OMR: 'ر.ع', JOD: 'د.أ'
};

// ===================== دوال مساعدة =====================
function fmt(v, d) {
  if (!isFinite(v)) return '-';
  d = (d === undefined) ? 2 : d;
  return new Intl.NumberFormat('ar-EG-u-nu-latn', {
    minimumFractionDigits: d, maximumFractionDigits: d
  }).format(v);
}

function setStatus(live) {
  document.getElementById('statusDot').classList.toggle('offline', !live);
}

function updateTimestamp(date) {
  if (!(date instanceof Date) || isNaN(date)) date = new Date();
  document.getElementById('lastUpdated').textContent = new Intl.DateTimeFormat('ar-EG-u-nu-latn', {
    dateStyle: 'medium', timeStyle: 'short'
  }).format(date);
  document.getElementById('year').textContent = date.getFullYear();
}

async function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), ms || FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
    clearTimeout(t);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    clearTimeout(t);
    throw e;
  }
}

// ===================== جلب سعر الذهب =====================
async function fetchGoldPrice() {
  for (const src of GOLD_SOURCES) {
    try {
      console.log('🔄 Gold trying:', src.name);
      const data = await fetchWithTimeout(src.url);
      const price = src.parse(data);
      if (price && price > 0) {
        console.log('✅ Gold OK from:', src.name, '→', price);
        return { priceUsdOz: price, source: src.name, asOf: new Date() };
      }
      console.warn('⚠️ Invalid price from:', src.name);
    } catch (e) {
      console.warn('❌ Gold failed:', src.name, '-', e.message);
    }
  }
  throw new Error('كل مصادر الذهب فشلت');
}

// ===================== جلب أسعار العملات =====================
async function fetchCurrencyRates() {
  for (const src of CURRENCY_SOURCES) {
    try {
      console.log('🔄 Currency trying:', src.name);
      const data = await fetchWithTimeout(src.url);
      const rates = src.parse(data);
      if (rates && Object.keys(rates).length > 0) {
        console.log('✅ Currency OK from:', src.name);
        return rates;
      }
      console.warn('⚠️ Invalid rates from:', src.name);
    } catch (e) {
      console.warn('❌ Currency failed:', src.name, '-', e.message);
    }
  }
  throw new Error('كل مصادر العملات فشلت');
}

// ===================== رسم بطاقة الدولة =====================
function renderCountry(country, goldPrices, currencyRates) {
  const sym = CURRENCY_SYMBOLS[country.currency] || country.currency;
  const section = document.createElement('section');
  section.className = 'country-section';

  let goldRows = '';
  if (goldPrices) {
    goldRows =
      `<tr><td class="label-cell">عيار 24</td><td class="value-cell gold">${fmt(goldPrices.k24, 0)} ${sym}</td></tr>` +
      `<tr><td class="label-cell">عيار 22</td><td class="value-cell gold">${fmt(goldPrices.k22, 0)} ${sym}</td></tr>` +
      `<tr><td class="label-cell">عيار 21</td><td class="value-cell gold">${fmt(goldPrices.k21, 0)} ${sym}</td></tr>` +
      `<tr><td class="label-cell">عيار 18</td><td class="value-cell gold">${fmt(goldPrices.k18, 0)} ${sym}</td></tr>`;
  } else {
    goldRows = `<tr><td colspan="2" style="text-align:center;color:var(--text-muted);padding:20px;">لا تتوفر بيانات الذهب</td></tr>`;
  }

  let currencyRows = '';
  if (currencyRates && Object.keys(currencyRates).length > 0) {
    currencyRows = TARGET_CURRENCIES
      .filter(code => currencyRates[code] != null && currencyRates[code] > 0)
      .map(code =>
        `<tr>` +
          `<td><div style="font-weight:500">${CURRENCY_NAMES[code] || code}</div></td>` +
          `<td><span class="code-badge">${code}</span></td>` +
          `<td class="value-cell inverted">${fmt(currencyRates[code], 2)} ${sym}</td>` +
        `</tr>`
      ).join('');
    if (!currencyRows) {
      currencyRows = `<tr><td colspan="3" style="text-align:center;color:var(--text-muted);padding:20px;">لا تتوفر بيانات العملات</td></tr>`;
    }
  } else {
    currencyRows = `<tr><td colspan="3" style="text-align:center;color:var(--text-muted);padding:20px;">لا تتوفر بيانات العملات</td></tr>`;
  }

  section.innerHTML =
    `<div class="country-head">` +
      `<h2 class="country-title"><span class="flag">${country.flag}</span>${country.name}</h2>` +
      `<span class="country-meta">${country.currency} · أسعار محلية</span>` +
    `</div>` +
    `<div class="country-grid">` +
      `<div class="card">` +
        `<div class="card-header"><span class="dot gold"></span> الذهب (لكل جرام)</div>` +
        `<div class="overflow"><table><thead><tr><th>العيار</th><th>السعر</th></tr></thead><tbody>${goldRows}</tbody></table></div>` +
      `</div>` +
      `<div class="card">` +
        `<div class="card-header"><span class="dot blue"></span> العملات مقابل ${sym}</div>` +
        `<div class="overflow"><table><thead><tr><th>العملة</th><th>الكود</th><th>1 وحدة = ؟</th></tr></thead><tbody>${currencyRows}</tbody></table></div>` +
      `</div>` +
    `</div>`;

  document.getElementById('countriesContainer').appendChild(section);
}

// ===================== الدالة الرئيسية =====================
async function loadAll() {
  const container = document.getElementById('countriesContainer');
  container.innerHTML = `<p style="text-align:center; padding:60px 0; color:var(--text-muted);">جاري تحميل البيانات...</p>`;
  document.getElementById('rateUsed').textContent = 'جاري الجلب...';
  setStatus(false);

  // جلب بالتوازي مع السماح بفشل جزء دون الآخر
  const [goldSettled, currencySettled] = await Promise.allSettled([
    fetchGoldPrice(),
    fetchCurrencyRates()
  ]);

  const goldResult = goldSettled.status === 'fulfilled' ? goldSettled.value : null;
  const currencyRates = currencySettled.status === 'fulfilled' ? currencySettled.value : null;

  if (!goldResult && !currencyRates) {
    container.innerHTML =
      `<div style="text-align:center; padding:60px 20px;">` +
        `<p style="color:var(--text-muted); margin-bottom:20px;">⚠️ تعذر تحميل البيانات. تحقق من اتصالك وحاول مجدداً.</p>` +
        `<button onclick="loadAll()" style="background:var(--gold); color:var(--bg); border:none; padding:12px 30px; border-radius:100px; font-family:inherit; font-weight:700; cursor:pointer;">إعادة المحاولة</button>` +
      `</div>`;
    document.getElementById('rateUsed').textContent = 'غير متاح';
    setStatus(false);
    return;
  }

  if (goldResult) {
    document.getElementById('rateUsed').textContent = `$${fmt(goldResult.priceUsdOz, 2)} / أونصة`;
    updateTimestamp(goldResult.asOf);
  } else {
    document.getElementById('rateUsed').textContent = 'غير متاح';
    updateTimestamp(new Date());
  }

  container.innerHTML = '';

  COUNTRIES.forEach(country => {
    const localPerUsd = currencyRates ? currencyRates[country.currency] : null;
    let goldPrices = null;
    const currencyObj = {};

    if (goldResult && localPerUsd && localPerUsd > 0) {
      const goldLocalGram = (goldResult.priceUsdOz * localPerUsd) / OZ_TO_GRAM;
      goldPrices = {
        k24: goldLocalGram,
        k22: goldLocalGram * 22 / 24,
        k21: goldLocalGram * 21 / 24,
        k18: goldLocalGram * 18 / 24
      };
    }

    if (currencyRates && localPerUsd && localPerUsd > 0) {
      TARGET_CURRENCIES.forEach(code => {
        const foreignPerUsd = currencyRates[code];
        if (foreignPerUsd && foreignPerUsd > 0) {
          currencyObj[code] = localPerUsd / foreignPerUsd;
        }
      });
    }

    renderCountry(country, goldPrices, currencyObj);
  });

  setStatus(true);
  console.log('✅ تم التحميل | الذهب:', goldResult ? goldResult.source : 'فشل', '| العملات:', currencyRates ? 'OK' : 'فشل');
}

// ===================== التشغيل =====================
loadAll();
setInterval(loadAll, 5 * 60 * 1000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW:', err));
}
</script>
