<body><header class="top"><div class="wrap"><a class="brand" href="/">عيار</a></div></header><main class="wrap"><article class="panel"><h1>سياسة الخصوصية</h1>
<p>توضح هذه السياسة بصورة عامة كيفية تعامل موقع عيار (ayargo.com) مع المعلومات عند زيارة الموقع واستخدام خدماته. باستخدامك للموقع، فإنك تقر بأنك قرأت هذه السياسة.</p>
<h2>المعلومات التي قد يتم جمعها</h2><p>قد تُعالج معلومات تقنية أساسية يرسلها المتصفح تلقائيًا، مثل نوع المتصفح والجهاز وعنوان IP ووقت الزيارة والصفحات التي تمت مشاهدتها، وذلك لأغراض تشغيل الموقع وحمايته وقياس الأداء وتحسين التجربة. وإذا تواصلت معنا بالبريد الإلكتروني، فسنتلقى البيانات التي تختار إرسالها ضمن رسالتك.</p>
<h2>ملفات تعريف الارتباط والتخزين المحلي</h2><p>قد يستخدم الموقع ملفات تعريف الارتباط أو تقنيات التخزين المحلي اللازمة لتذكر بعض تفضيلات العرض وتحسين عمل الصفحات. كما قد تستخدم خدمات القياس أو الإعلانات التابعة لجهات خارجية تقنيات مماثلة وفق إعداداتها وسياساتها. يمكنك إدارة ملفات الارتباط من إعدادات المتصفح، وقد يؤثر تعطيل بعضها في بعض وظائف الموقع.</p>
<h2>الخدمات ومصادر الطرف الثالث</h2><p>قد يعتمد الموقع على خدمات خارجية لتوفير بيانات الأسعار أو الأخبار أو الرسوم البيانية أو عرض الإعلانات وقياس الاستخدام. وقد تتلقى هذه الجهات بيانات تقنية عند اتصال متصفحك بخدماتها. تخضع معالجة تلك البيانات لسياسات مزودي الخدمات أنفسهم، وننصح بمراجعة سياساتهم.</p>
<h2>كيف نستخدم المعلومات؟</h2><ul><li>تشغيل الموقع وصيانته وتحسين أدائه.</li><li>الحد من إساءة الاستخدام وحماية الموقع.</li><li>الرد على الرسائل والاستفسارات.</li><li>فهم الاستخدام العام للموقع وتحسين المحتوى والخدمات.</li></ul>
<h2>حماية المعلومات والاحتفاظ بها</h2><p>نتخذ تدابير معقولة للمساعدة في حماية المعلومات، لكن لا يمكن ضمان أمن أي نقل أو تخزين إلكتروني بصورة مطلقة. نحتفظ بالمعلومات للمدة اللازمة للأغراض الموضحة أو وفق المتطلبات القانونية والتنظيمية المنطبقة.</p>
<h2>روابط خارجية</h2><p>قد يحتوي الموقع على روابط لمواقع أخرى لا نديرها. لا نتحكم في محتواها أو ممارسات الخصوصية لديها.</p>
<h2>تحديث السياسة والتواصل</h2><p>قد نحدّث هذه السياسة عند الحاجة، وسيُنشر الإصدار الأحدث على هذه الصفحة. للاستفسارات المتعلقة بالخصوصية، راسلنا على <a href="mailto:info@ayargo.com">info@ayargo.com</a>.</p><p class="muted">آخر تحديث: 22 نوفمبر 2026.</p></article>
